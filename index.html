<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LARAP Cipongkor - FIX</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;height:100vh;display:flex;flex-direction:column}
.top{background:#1e2a5a;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.main{flex:1;display:flex;overflow:hidden}
.left{width:340px;background:#f8fafc;border-right:1px solid #ddd;padding:10px;overflow:auto}
#map{flex:1;background:#e5e7eb}
.right{width:380px;background:#fff;border-left:2px solid #e2e8f0;padding:12px;overflow:auto}
.group{margin-bottom:10px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}
.group-head{background:#e2e8f0;padding:8px 10px;font-weight:bold;font-size:11px;text-transform:uppercase;display:flex;justify-content:space-between;cursor:pointer;user-select:none}
.group-body{padding:6px 10px;display:block}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 6px;border-bottom:1px solid #f1f5f9;font-size:12px;cursor:pointer;border-radius:6px}
.row:hover{background:#f1f5f9}
.row.active{background:#dbeafe}
.dot{width:12px;height:12px;border-radius:2px;display:inline-block;margin-right:6px;border:1px solid #0003;flex-shrink:0}
input.search{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;margin:8px 0}
table.detail{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
table.detail td{padding:5px 6px;border-bottom:1px solid #f1f5f9;vertical-align:top;word-break:break-word}
table.detail td:first-child{font-weight:bold;color:#475569;width:38%}
.card{padding:8px;border-radius:8px;font-size:12px;text-align:center}
#log{font-size:10px;color:#ef4444;margin-top:8px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="top"><b>WebGIS LARAP Cipongkor - 36 Bidang</b><span id="status">Loading...</span></div>
<div class="main">
<div class="left">
<input class="search" id="searchBox" placeholder="Cari Kode / Nama / NIB...">
<div id="list"></div>
<hr><b style="font-size:12px">Analisis</b>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">
<div class="card" style="background:#dcfce7"><small>Neglasari</small><br><b id="s-ngl">0 bd<br>0 ha</b></div>
<div class="card" style="background:#ecfccb"><small>Sarinagen</small><br><b id="s-srg">0 bd<br>0 ha</b></div>
<div class="card" style="background:#fef9c3;grid-column:span 2"><small>Total</small><br><b id="s-all">0 bd<br>0 ha</b></div>
</div>
<div id="log"></div>
</div>
<div id="map"></div>
<div class="right">
<b>DETAIL BIDANG</b><small> (klik bidang / klik list kiri)</small>
<div id="detail" style="margin-top:10px;color:#64748b;font-size:12px">Belum ada bidang dipilih. Klik di panel kiri atau klik bidang di peta.</div>
</div>
</div>
<script>
var map=L.map('map').setView([-6.85,107.32],15);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:22}).addTo(map);

var allFeatures=[], boundsGroup=L.featureGroup();
var layerStore={}; // label -> layer

// DAFTAR FILE BARU KAMU - 19 FILE - PASTI ADA
const FILES = [
  {file:'area_proyek_cilanang', label:'area_proyek_cilanang', group:'area_proyek', color:'#ef4444', fill:'#ef4444', fillOp:0.05, weight:3, dash:'8,6'},
  {file:'batas_administrasi', label:'batas_administrasi', group:'area_proyek', color:'#facc15', fill:'transparent', fillOp:0, weight:4, dash:'10,6'},
  {file:'tanah_negara_srg', label:'tanah_negara_srg', group:'tanah_negara', color:'#9e9d24', fill:'#ffeb3b', fillOp:0.65},
  {file:'tanah_negara_ngl', label:'tanah_negara_ngl', group:'tanah_negara', color:'#9e9d24', fill:'#ffeb3b', fillOp:0.65},
  {file:'bbws_ngl', label:'bbws_ngl', group:'bbws', color:'#f59e0b', fill:'#ffeb3b', fillOp:0.6},
  {file:'bbws_srg', label:'bbws_srg', group:'bbws', color:'#f59e0b', fill:'#ffeb3b', fillOp:0.6},
  {file:'pertanian_ngl', label:'pertanian_ngl', group:'penggunaan_lahan_dan_fasilitas_umum', color:'#16a34a', fill:'#4ade80', fillOp:0.75},
  {file:'pertanian_srg', label:'pertanian_srg', group:'penggunaan_lahan_dan_fasilitas_umum', color:'#16a34a', fill:'#4ade80', fillOp:0.75},
  {file:'perkebunan', label:'perkebunan', group:'penggunaan_lahan_dan_fasilitas_umum', color:'#a16207', fill:'#fbbf24', fillOp:0.7},
  {file:'permukiman', label:'permukiman', group:'penggunaan_lahan_dan_fasilitas_umum', color:'#9333ea', fill:'#e9d5ff', fillOp:0.7},
  {file:'bangunan_utama', label:'bangunan_utama', group:'bangunan_terdampak', color:'#be123c', fill:'#fb7185', fillOp:0.9},
  {file:'bangunan_sekunder_ngl', label:'bangunan_sekunder_ngl', group:'bangunan_terdampak', color:'#881337', fill:'#fda4af', fillOp:0.85},
  {file:'SHM', label:'SHM', group:'pemilikan_dan_penguasaan_lahan', color:'#000', fill:'#22c55e', fillOp:0.65, isBidang:true},
  {file:'shm_ngl', label:'shm_ngl', group:'pemilikan_dan_penguasaan_lahan', color:'#15803d', fill:'#22c55e', fillOp:0.65, isBidang:true, desa:'NGL'},
  {file:'shm_srg', label:'shm_srg', group:'pemilikan_dan_penguasaan_lahan', color:'#65a30d', fill:'#a3e635', fillOp:0.65, isBidang:true, desa:'SRG'},
  {file:'SPPT_PBB', label:'SPPT_PBB', group:'pemilikan_dan_penguasaan_lahan', color:'#6d28d9', fill:'#a78bfa', fillOp:0.5, isBidang:true},
  {file:'sppt_pbb_ngl', label:'sppt_pbb_ngl', group:'pemilikan_dan_penguasaan_lahan', color:'#5b21b6', fill:'#a78bfa', fillOp:0.5, isBidang:true, desa:'NGL'},
  {file:'sppt_pbb_srg', label:'sppt_pbb_srg', group:'pemilikan_dan_penguasaan_lahan', color:'#4c1d95', fill:'#a78bfa', fillOp:0.5, isBidang:true, desa:'SRG'},
  {file:'surat_perjanjian_jualbeli_ngl', label:'surat_perjanjian_jualbeli_ngl', group:'pemilikan_dan_penguasaan_lahan', color:'#9a3412', fill:'#fb923c', fillOp:0.6, isBidang:true, desa:'NGL'},
];

const GROUP_ORDER = ['area_proyek','tanah_negara','bbws','penggunaan_lahan_dan_fasilitas_umum','bangunan_terdampak','pemilikan_dan_penguasaan_lahan'];

function showDetail(props,fname){
  let html=`<div style="font-size:11px;color:#64748b;margin-bottom:4px">File: <b>${fname}</b></div><table class="detail">`;
  for(let k in props){
    if(k.startsWith('_')||k.startsWith('Shape_')) continue;
    let v=props[k]; if(v===null||v==='') v='-';
    html+=`<tr><td>${k}</td><td>${v}</td></tr>`;
  }
  html+='</table>';
  document.getElementById('detail').innerHTML=html;
}

async function init(){
  GROUP_ORDER.forEach(g=>{
    let div=document.createElement('div'); div.className='group'; div.id='g-'+g;
    div.innerHTML=`<div class="group-head" data-group="${g}"><span>${g.replaceAll('_',' ')}</span><span class="arrow">▼</span></div><div class="group-body" id="body-${g}"></div>`;
    document.getElementById('list').appendChild(div);
    div.querySelector('.group-head').onclick=()=>{
      let body=document.getElementById('body-'+g);
      let arrow=div.querySelector('.arrow');
      if(body.style.display==='none'){ body.style.display='block'; arrow.textContent='▼'; }
      else { body.style.display='none'; arrow.textContent='▶'; }
    };
  });

  let loaded=0, failed=[];
  let cNGL=0,cSRG=0,totalNGL=0,totalSRG=0;

  for(let def of FILES){
    let url = 'wgs/'+def.file+'.geojson';
    try{
      let res=await fetch(url);
      if(!res.ok){ failed.push(def.file); continue; }
      let gj=await res.json();
      let lg=L.geoJSON(gj,{
        style:{color:def.color,fillColor:def.fill,weight:def.weight||2,fillOpacity:def.fillOp, dashArray:def.dash||null},
        onEachFeature:(feat,ly)=>{
          let p=feat.properties||{};
          let kode=p.Kode_Peta||p.KODE||p.kode||p.NIB||p.ID||'-';
          let nama=p.NAMA||p.Nama||p.PEMILIK||p.Pemilik||p.nama||'-';
          let luas=p.LUAS_M2||p.Luas||p.luas||p.LUAS||0;
          allFeatures.push({kode:kode.toString().toLowerCase(),nama:nama.toString().toLowerCase(),layer:ly,props:p,fname:def.label, group:def.group});
          ly.bindTooltip(`${def.label}: ${kode}`,{sticky:true});
          ly.on('click',()=>{
            allFeatures.forEach(x=>{ try{x.layer.setStyle({weight:def.weight||2})}catch{}} );
            try{ly.setStyle({weight:5,color:'#000'})}catch{}
            showDetail(p,def.label);
            // highlight row kiri
            document.querySelectorAll('.row').forEach(r=>r.classList.remove('active'));
          });
          boundsGroup.addLayer(ly);
          let l=parseFloat(luas)||0;
          if(def.file.toLowerCase().includes('ngl')){ cNGL++; totalNGL+=l; }
          else if(def.file.toLowerCase().includes('srg')){ cSRG++; totalSRG+=l; }
          else if(def.group==='pemilikan_dan_penguasaan_lahan' && !def.file.toLowerCase().includes('ngl') && !def.file.toLowerCase().includes('srg')){ cNGL+=0.5; cSRG+=0.5; }
        }
      }).addTo(map);
      
      layerStore[def.label]=lg;
      loaded++;

      let body=document.getElementById('body-'+def.group);
      let row=document.createElement('div'); row.className='row'; row.dataset.label=def.label;
      row.innerHTML=`<div style="display:flex;align-items:center;flex:1"><span class="dot" style="background:${def.fill};border-color:${def.color}"></span><span style="flex:1">${def.label} <small style="color:#64748b">(${gj.features?.length||0})</small></span></div><input type="checkbox" checked>`;
      body.appendChild(row);

      // KLIK ROW -> LANGSUNG ZOOM KE LAYER + SHOW DETAIL
      row.onclick=(e)=>{
        if(e.target.tagName==='INPUT') return; // biar checkbox tidak double
        document.querySelectorAll('.row').forEach(r=>r.classList.remove('active'));
        row.classList.add('active');
        try{ map.fitBounds(lg.getBounds(),{maxZoom:19,padding:[30,30]}); }catch{}
        // ambil 1 fitur pertama buat detail
        if(gj.features && gj.features[0]) showDetail(gj.features[0].properties, def.label);
      };
      // CHECKBOX ON/OFF
      let chk=row.querySelector('input');
      chk.onchange=(e)=>{
        e.stopPropagation();
        if(chk.checked) map.addLayer(lg); else map.removeLayer(lg);
      };

    }catch(err){
      failed.push(def.file);
      console.error('Gagal load',def.file,err);
    }
  }

  document.getElementById('s-ngl').innerHTML=`${cNGL} bd<br>${(totalNGL/10000).toFixed(4)} ha`;
  document.getElementById('s-srg').innerHTML=`${cSRG} bd<br>${(totalSRG/10000).toFixed(4)} ha`;
  document.getElementById('s-all').innerHTML=`${cNGL+cSRG} bd<br>${((totalNGL+totalSRG)/10000).toFixed(4)} ha`;
  document.getElementById('status').innerText=`${loaded}/${FILES.length} loaded`;

  if(failed.length>0){
    document.getElementById('log').innerText='Gagal load: '+failed.join(', ')+'\nPastikan file ada di wgs/ dan sudah di push ke GitHub';
  }

  if(boundsGroup.getLayers().length>0){
    try{ map.fitBounds(boundsGroup.getBounds(),{padding:[30,30]}); }catch{}
  }

  document.getElementById('searchBox').addEventListener('input',function(){
    let q=this.value.toLowerCase().trim(); if(q.length<2) return;
    let found=allFeatures.find(x=>x.kode.includes(q)||x.nama.includes(q));
    if(found){
      map.fitBounds(found.layer.getBounds(),{maxZoom:19,padding:[50,50]});
      found.layer.fire('click');
      document.querySelectorAll('.row').forEach(r=>{ if(r.dataset.label===found.fname) r.classList.add('active'); else r.classList.remove('active'); });
    }
  });
}
init();
</script>
</body>
</html>
