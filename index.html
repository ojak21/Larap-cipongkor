<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LARAP Cipongkor - Luas Fix</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;height:100vh;display:flex;flex-direction:column}
.top{background:#1e2a5a;color:#fff;padding:10px 14px;display:flex;justify-content:space-between}
.main{flex:1;display:flex;overflow:hidden}
.left{width:360px;background:#f8fafc;border-right:1px solid #ddd;padding:10px;overflow:auto}
#map{flex:1;background:#e5e7eb}
.right{width:380px;background:#fff;border-left:2px solid #e2e8f0;padding:12px;overflow:auto}
.group{margin-bottom:10px;background:#fff;border:1px solid #e2e8f0;border-radius:8px}
.group-head{background:#e2e8f0;padding:8px 10px;font-weight:bold;font-size:11px;text-transform:uppercase;display:flex;justify-content:space-between;cursor:pointer}
.group-body{padding:6px 10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 6px;border-bottom:1px solid #f1f5f9;font-size:12px;cursor:pointer;border-radius:6px}
.row:hover{background:#f1f5f9}.row.active{background:#dbeafe}
.dot{width:12px;height:12px;border-radius:2px;display:inline-block;margin-right:6px;border:1px solid #0003}
input.search{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;margin:8px 0}
table.detail{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
table.detail td{padding:5px 6px;border-bottom:1px solid #f1f5f9;word-break:break-word}
table.detail td:first-child{font-weight:bold;width:38%;color:#475569}
.card{padding:10px;border-radius:8px;font-size:12px;text-align:center}
.btn{padding:6px 10px;background:#1e2a5a;color:#fff;border:none;border-radius:6px;font-size:11px;cursor:pointer}
</style>
</head>
<body>
<div class="top"><b>LARAP Cipongkor - Luas SRG Fix</b><span id="status">Loading...</span></div>
<div class="main">
<div class="left">
<input class="search" id="searchBox" placeholder="Cari Kode / Nama...">
<div style="display:flex;gap:4px;margin:6px 0"><button class="btn" onclick="showAll()">Semua</button><button class="btn" onclick="showNGL()">NGL</button><button class="btn" onclick="showSRG()">SRG</button></div>
<div id="list"></div>
<hr><b style="font-size:12px">Analisis Luas (Hitung Otomatis Geometri)</b>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">
<div class="card" style="background:#dcfce7"><small>Neglasari (NGL)</small><br><b id="s-ngl">0 bd<br>0 ha</b><br><small id="d-ngl" style="font-size:9px;color:#166534"></small></div>
<div class="card" style="background:#ecfccb"><small>Sarinagen (SRG)</small><br><b id="s-srg">0 bd<br>0 ha</b><br><small id="d-srg" style="font-size:9px;color:#3f6212"></small></div>
<div class="card" style="background:#fef9c3;grid-column:span 2"><small>Total</small><br><b id="s-all">0 bd<br>0 ha</b></div>
</div>
</div>
<div id="map"></div>
<div class="right">
<b>DETAIL BIDANG</b>
<div id="detail" style="margin-top:10px;color:#64748b;font-size:12px">Klik bidang di peta / list kiri...</div>
</div>
</div>
<script>
var map=L.map('map').setView([-6.85,107.32],16);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:22}).addTo(map);
var allFeatures=[], boundsGroup=L.featureGroup(), layerStore={};

const FILES = [
  {file:'area_proyek_cilanang', label:'area_proyek_cilanang', group:'area_proyek', color:'#ef4444', fill:'#ef4444', fillOp:0.05, weight:3, dash:'8,6'},
  {file:'batas_administrasi', label:'batas_administrasi', group:'area_proyek', color:'#facc15', fill:'transparent', fillOp:0, weight:4, dash:'10,6'},
  {file:'tanah_negara_srg', label:'tanah_negara_srg', group:'tanah_negara', color:'#9e9d24', fill:'#ffeb3b', fillOp:0.65},
  {file:'tanah_negara_ngl', label:'tanah_negara_ngl', group:'tanah_negara', color:'#9e9d24', fill:'#ffeb3b', fillOp:0.65},
  {file:'bbws_ngl', label:'bbws_ngl', group:'bbws', color:'#f59e0b', fill:'#ffeb3b', fillOp:0.6},
  {file:'bbws_srg', label:'bbws_srg', group:'bbws', color:'#f59e0b', fill:'#ffeb3b', fillOp:0.6},
  {file:'pertanian_ngl', label:'pertanian_ngl', group:'penggunaan_lahan', color:'#16a34a', fill:'#4ade80', fillOp:0.75},
  {file:'pertanian_srg', label:'pertanian_srg', group:'penggunaan_lahan', color:'#16a34a', fill:'#4ade80', fillOp:0.75},
  {file:'perkebunan', label:'perkebunan', group:'penggunaan_lahan', color:'#a16207', fill:'#fbbf24', fillOp:0.7},
  {file:'permukiman', label:'permukiman', group:'penggunaan_lahan', color:'#9333ea', fill:'#e9d5ff', fillOp:0.7},
  {file:'bangunan_utama', label:'bangunan_utama', group:'bangunan_terdampak', color:'#be123c', fill:'#fb7185', fillOp:0.9},
  {file:'bangunan_sekunder_ngl', label:'bangunan_sekunder_ngl', group:'bangunan_terdampak', color:'#881337', fill:'#fda4af', fillOp:0.85},
  {file:'shm_ngl', label:'shm_ngl', group:'pemilikan_lahan', color:'#15803d', fill:'#22c55e', fillOp:0.75, isBidang:true, desa:'NGL'},
  {file:'shm_srg', label:'shm_srg', group:'pemilikan_lahan', color:'#65a30d', fill:'#a3e635', fillOp:0.75, isBidang:true, desa:'SRG'},
  {file:'sppt_pbb_ngl', label:'sppt_pbb_ngl', group:'pemilikan_lahan', color:'#5b21b6', fill:'#a78bfa', fillOp:0.6, isBidang:true, desa:'NGL'},
  {file:'sppt_pbb_srg', label:'sppt_pbb_srg', group:'pemilikan_lahan', color:'#4c1d95', fill:'#a78bfa', fillOp:0.6, isBidang:true, desa:'SRG'},
  {file:'surat_perjanjian_jualbeli_ngl', label:'surat_perjanjian_jualbeli_ngl', group:'pemilikan_lahan', color:'#9a3412', fill:'#fb923c', fillOp:0.7, isBidang:true, desa:'NGL'},
];

const GROUP_ORDER = ['area_proyek','tanah_negara','bbws','penggunaan_lahan','bangunan_terdampak','pemilikan_lahan'];

// Hitung luas geodesik dari LatLngs (akurasi cukup untuk ha)
function geodesicArea(latlngs){
  let area=0;
  let len=latlngs.length;
  if(len<3) return 0;
  for(let i=0;i<len;i++){
    let p1=latlngs[i], p2=latlngs[(i+1)%len];
    // rumus L.GeometryUtil.geodesicArea Leaflet
    area += (p2.lng - p1.lng) * (2 + Math.sin(p1.lat*Math.PI/180) + Math.sin(p2.lat*Math.PI/180));
  }
  area = area * 6378137 * 6378137 / 2.0;
  return Math.abs(area); // m2
}
function getLayerArea(layer){
  try{
    if(layer.getLatLngs){
      let latlngs = layer.getLatLngs();
      // polygon bisa nested
      let flat = Array.isArray(latlngs[0][0]) ? latlngs[0] : latlngs;
      // kalau multi
      if(Array.isArray(flat[0]) && Array.isArray(flat[0][0])){
        let total=0;
        latlngs.forEach(poly=>{
          let ring = Array.isArray(poly[0]) ? poly[0] : poly;
          total+=geodesicArea(ring);
        });
        return total;
      } else {
        return geodesicArea(flat);
      }
    }
  }catch(e){ return 0; }
  return 0;
}
function getLuasFromProps(props){
  // cari field luas dengan berbagai variasi nama (case-insensitive)
  let keys = Object.keys(props);
  let candidates = ['LUAS_M2','Luas_M2','luas_m2','LUAS','Luas','luas','Luas (m2)','LUAS_M2_','Shape_Area'];
  for(let c of candidates){
    if(props[c]!==undefined && props[c]!==null && props[c]!==''){
      let v=parseFloat(props[c]); if(!isNaN(v) && v>0) return v;
    }
  }
  // cari yang mengandung kata luas
  for(let k of keys){
    if(k.toLowerCase().includes('luas')){
      let v=parseFloat(props[k]); if(!isNaN(v) && v>0) return v;
    }
  }
  return null;
}

function showDetail(p,fname,calculatedArea){
  let html=`<div style="font-size:11px;color:#64748b">File: <b>${fname}</b> | Luas hitung: <b>${(calculatedArea/10000).toFixed(4)} ha (${calculatedArea.toFixed(1)} m²)</b></div><table class="detail">`;
  for(let k in p){
    if(k.startsWith('_')||k.startsWith('Shape_')) continue;
    let v=p[k]; if(v===null||v==='') v='-';
    html+=`<tr><td>${k}</td><td>${v}</td></tr>`;
  }
  html+=`<tr style="background:#fef9c3"><td>LUAS_HITUNG_M2</td><td>${calculatedArea.toFixed(2)} m²</td></tr>`;
  html+=`<tr style="background:#fef9c3"><td>LUAS_HITUNG_HA</td><td>${(calculatedArea/10000).toFixed(4)} ha</td></tr>`;
  html+='</table>';
  document.getElementById('detail').innerHTML=html;
}

function showAll(){Object.values(layerStore).forEach(l=>map.addLayer(l));document.querySelectorAll('.row input').forEach(c=>c.checked=true);}
function showNGL(){Object.entries(layerStore).forEach(([k,l])=>{if(k.toLowerCase().includes('ngl')||k.includes('area')||k.includes('batas'))map.addLayer(l);else map.removeLayer(l);});}
function showSRG(){Object.entries(layerStore).forEach(([k,l])=>{if(k.toLowerCase().includes('srg')||k.includes('area')||k.includes('batas'))map.addLayer(l);else map.removeLayer(l);});}

async function init(){
  GROUP_ORDER.forEach(g=>{
    let d=document.createElement('div');d.className='group';d.id='g-'+g;
    d.innerHTML=`<div class="group-head"><span>${g.replaceAll('_',' ')}</span><span>▼</span></div><div class="group-body" id="body-${g}"></div>`;
    document.getElementById('list').appendChild(d);
    d.querySelector('.group-head').onclick=()=>{let b=document.getElementById('body-'+g);b.style.display=b.style.display==='none'?'block':'none';};
  });
  let cNGL=0,cSRG=0,totalNGL=0,totalSRG=0,loaded=0;
  let detailNGL=[], detailSRG=[];
  for(let def of FILES){
    try{
      let res=await fetch('wgs/'+def.file+'.geojson');
      if(!res.ok) continue;
      let gj=await res.json();
      let lg=L.geoJSON(gj,{
        style:{color:def.color,fillColor:def.fill,weight:def.weight||2,fillOpacity:def.fillOp,dashArray:def.dash||null},
        onEachFeature:(feat,ly)=>{
          let p=feat.properties||{};
          let kode=p.Kode_Peta||p.KODE||p.kode||p.NIB||'-';
          let nama=p.NAMA||p.Nama||p.PEMILIK||p.Pemilik||'-';
          // hitung luas
          let luasProp = getLuasFromProps(p);
          let luasCalc = getLayerArea(ly);
          let luasFinal = luasProp && luasProp>0 ? luasProp : luasCalc;
          if(luasFinal===0) luasFinal = luasCalc; // fallback
          // simpan
          ly._luasM2 = luasFinal;
          allFeatures.push({kode:kode.toString().toLowerCase(),nama:nama.toString().toLowerCase(),layer:ly,props:p,fname:def.label,luas:luasFinal});
          ly.bindTooltip(`${def.label}: ${kode} - ${(luasFinal/10000).toFixed(4)} ha`,{sticky:true});
          ly.on('click',()=>{showDetail(p,def.label,luasFinal);});
          boundsGroup.addLayer(ly);
          if(def.desa==='NGL'){cNGL++;totalNGL+=luasFinal;detailNGL.push(luasFinal);}
          else if(def.desa==='SRG'){cSRG++;totalSRG+=luasFinal;detailSRG.push(luasFinal);}
        }
      }).addTo(map);
      layerStore[def.label]=lg;loaded++;
      let body=document.getElementById('body-'+def.group);
      let row=document.createElement('div');row.className='row';row.dataset.label=def.label;
      let isNGL=def.label.toLowerCase().includes('ngl');
      row.style.borderLeft=isNGL?'4px solid #16a34a':'4px solid #65a30d';
      row.innerHTML=`<div style="display:flex;align-items:center;flex:1"><span class="dot" style="background:${def.fill};border-color:${def.color}"></span><span>${def.label} <small style="color:#64748b">(${gj.features?.length||0})</small></span></div><input type="checkbox" checked>`;
      body.appendChild(row);
      row.onclick=(e)=>{if(e.target.tagName==='INPUT')return;document.querySelectorAll('.row').forEach(r=>r.classList.remove('active'));row.classList.add('active');try{map.fitBounds(lg.getBounds(),{maxZoom:19,padding:[30,30]})}catch{};};
      row.querySelector('input').onchange=(e)=>{e.stopPropagation();if(e.target.checked)map.addLayer(lg);else map.removeLayer(lg);};
    }catch(e){console.log('error',def.file,e);}
  }
  document.getElementById('s-ngl').innerHTML=`${cNGL} bd<br>${(totalNGL/10000).toFixed(4)} ha`;
  document.getElementById('s-srg').innerHTML=`${cSRG} bd<br>${(totalSRG/10000).toFixed(4)} ha`;
  document.getElementById('s-all').innerHTML=`${cNGL+cSRG} bd<br>${((totalNGL+totalSRG)/10000).toFixed(4)} ha`;
  document.getElementById('d-ngl').innerText=`Hitung geometri: ${detailNGL.length} bidang`;
  document.getElementById('d-srg').innerText=`Hitung geometri: ${detailSRG.length} bidang - FIXED`;
  document.getElementById('status').innerText=`${loaded} file - Luas SRG FIX`;
  if(boundsGroup.getLayers().length>0){try{map.fitBounds(boundsGroup.getBounds(),{padding:[30,30]})}catch{}}
  document.getElementById('searchBox').addEventListener('input',function(){let q=this.value.toLowerCase().trim();if(q.length<2)return;let f=allFeatures.find(x=>x.kode.includes(q)||x.nama.includes(q));if(f){map.fitBounds(f.layer.getBounds(),{maxZoom:19,padding:[50,50]});f.layer.fire('click');}});
}
init();
</script>
</body>
</html>
